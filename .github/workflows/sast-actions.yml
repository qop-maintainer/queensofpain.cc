name: Scan GitHub Actions with Zizmor

on:
  schedule:
    - cron: "32 03 * * 0" # Every Sunday at 03:32 UTC
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Require containers to run Zizmor Action
          disable-sudo-and-containers: false
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            files.pythonhosted.org:443
            pypi.org:443

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan GitHub Actions
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
