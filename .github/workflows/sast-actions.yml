name: Scan GitHub Actions with Zizmor

on:
  schedule:
    - cron: "32 03 * * 0" # Every Sunday at 03:32 UTC
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Require containers to run Zizmor Action
          disable-sudo-and-containers: false
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            files.pythonhosted.org:443
            pypi.org:443

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan GitHub Actions
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
